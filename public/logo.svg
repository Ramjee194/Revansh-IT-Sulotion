<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 85 75" width="100%" height="100%">
  <defs>
    <!-- Corporate Blue Gradient -->
    <linearGradient id="logo-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Amber/Gold Gradient -->
    <linearGradient id="logo-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#de952a" />
      <stop offset="100%" stop-color="#c98322" />
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&amp;display=swap');
    .logo-o {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: 66px;
      font-weight: 900;
      font-style: italic;
      fill: url(#logo-blue-grad);
    }
    .logo-r {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: 66px;
      font-weight: 900;
      font-style: italic;
      fill: url(#logo-gold-grad);
    }
  </style>
  
  <!-- Monogram OR -->
  <g>
    <!-- Letter O -->
    <text x="12" y="76" class="logo-o">O</text>
    <!-- Letter R -->
    <text x="44" y="76" class="logo-r">R</text>
    
    <!-- Modern Cursive Sweeping Tail -->
    <path d="M 64,74 C 54,86 31,88 19,81 C 17,80 18,78 20,78 C 30,84 52,83 61,72 Z" fill="url(#logo-gold-grad)" />
  </g>
</svg>
