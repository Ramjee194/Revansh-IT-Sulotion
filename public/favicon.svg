<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="60%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#032D23"/>
    </linearGradient>
    <linearGradient id="fav-champagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8ECC9"/>
      <stop offset="60%" stop-color="#E6D3A3"/>
      <stop offset="100%" stop-color="#C5A880"/>
    </linearGradient>
  </defs>
  
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fav-emerald)" stroke="url(#fav-champagne)" stroke-width="1.8"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="rgba(248, 236, 201, 0.25)" stroke-width="0.8"/>
  
  <!-- Monogram OR -->
  <text x="11" y="44" fill="url(#fav-champagne)" font-family="Georgia, 'Playfair Display', serif" font-size="34" font-weight="900" font-style="italic">O</text>
  <text x="29" y="44" fill="url(#fav-champagne)" font-family="Georgia, 'Playfair Display', serif" font-size="34" font-weight="900" font-style="italic">R</text>
  
  <!-- Flourish Tail -->
  <path d="M 46,43 C 38,51 22,52 14,48 C 12,47 13,46 15,46 C 21,50 36,49 43,42 Z" fill="url(#fav-champagne)"/>
  
  <!-- Star Sparkle -->
  <circle cx="49" cy="18" r="2" fill="#10B981"/>
  <circle cx="49" cy="18" r="1" fill="#F8ECC9"/>
</svg>
